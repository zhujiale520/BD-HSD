[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bd-hsd"
version = "0.1.0"
description = "Budget-decoupled hybrid speculative decoding for LLM inference runtimes"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "BD-HSD contributors" }]
dependencies = []

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
